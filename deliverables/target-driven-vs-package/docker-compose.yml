services:
  target-driven-vs:
    image: target-driven-vs-api:latest
    container_name: target-driven-vs-api
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TAME_VS_PRELOAD_MODELS: "false"
      TAME_VS_TIMEOUT: "1800"
    ports:
      - "8000:8000"
    shm_size: "4gb"
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
    restart: unless-stopped
