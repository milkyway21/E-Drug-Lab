# Project Hermes home template — copied to $PROJECT/.hermes/config.yaml by
# scripts/sync_providers_from_ccswitch.py (secrets stay in .hermes/.env).
#
# Set OPENAI_BASE_URL / OPENAI_API_KEY (or key_env) locally; do not commit real endpoints or keys.

model:
  provider: openai-relay
  default: gpt-5.6-sol
  context_length: 1050000

providers:
  openai-relay:
    name: OpenAI Responses Relay
    base_url: "https://your-openai-compatible-endpoint/v1"
    key_env: OPENAI_API_KEY
    api_mode: codex_responses
    default_model: gpt-5.6-sol
    models:
      gpt-5.6-sol:
        context_length: 1050000

# Competition eval mode: disable uncontrolled long-term memory writes
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0
  flush_min_turns: 0

agent:
  max_turns: 120
  reasoning_effort: xhigh
  disabled_toolsets:
    - memory

mcp_servers:
  scientist_in_e_drug_lab:
    command: "python"
    args: ["-m", "masld_agent.mcp_server"]
    tools:
      include:
        - masld_offline_demo
        - masld_run
        - platform_catalog
        - platform_health
        - diffdynamic_status
        - diffdynamic_generate
        - diffdynamic_extract
        - schrodinger_status
        - schrodinger_dock
        - schrodinger_mmgbsa

# Pip entry-point plugin (pyproject hermes_agent.plugins)
plugins:
  enabled:
    - scientist_in_e_drug_lab

# Curated project skills (see scripts/import_drug_skills.py)
skills:
  creation_enabled: true
  external_dirs:
    - skills_pack

# DiffDynamic / e-drug-lab / Schrödinger capability catalog (synced into .hermes/)
# Does not change SOUL identity — knowledge + gated tools only.
platform:
  overview: PLATFORM.md
  catalog: platform/catalog.yaml

# Branding: SCIENTIST ASCII + e-drug-lab hero (not Hermes gold caduceus)
display:
  skin: edrug-scientist
