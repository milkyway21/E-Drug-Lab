gene_symbol: HSD17B13
uniprot_id: Q7Z5P4
ensembl_id: ENSG00000186199
scientific_significance: >
  HSD17B13 localizes to hepatocyte lipid droplets and human genetic studies associate
  loss-of-function variants with lower risk of chronic liver disease progression.
clinical_significance: >
  Multiple industry programs pursue HSD17B13 inhibition for MASH/MASLD; still not an
  approved standard of care — classify as emerging rather than wholly novel.
uncertainty: >
  Genetic protection does not guarantee that pharmacological inhibition will safely
  reduce lipid accumulation without off-target or pathway compensation effects.

