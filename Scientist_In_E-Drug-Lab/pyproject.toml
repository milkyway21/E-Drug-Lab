[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist-in-e-drug-lab"
version = "0.1.0"
description = "Scientist_In_E-Drug-Lab — e-drug-lab drug-discovery research assistant (Hermes-compatible)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "E-Drug-Lab / AI4S Life Science" }]
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "tenacity>=8.2,<10",
  "rdkit>=2023.9.1; platform_system!='Darwin' or platform_machine!='arm64'",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.4,<1",
]
mcp = [
  "mcp>=1.0,<2",
]

[project.scripts]
masld-agent = "masld_agent.cli:app"

[project.entry-points."hermes_agent.plugins"]
scientist_in_e_drug_lab = "masld_agent.hermes_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masld_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
